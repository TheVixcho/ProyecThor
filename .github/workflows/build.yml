name: Build & Release Windows

on:
  push:
    branches:
      - main
      - beta
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Binarios Windows (MinGW)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar dependencias MinGW y Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 ninja-build
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Configurar CMake para Windows
        run: |
          cmake -B build-win -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$(pwd)/toolchain-mingw.cmake" \
            -DPROYECTHOR_BUILD_NUMBER=${{ github.run_number }}

      - name: Compilar ejecutable y recursos
        run: cmake --build build-win

      - name: Subir artefactos de compilación Windows
        uses: actions/upload-artifact@v4
        with:
          name: build-win
          path: |
            build-win/**
            !build-win/CMakeFiles/**
            !build-win/_deps/**
            !build-win/generated/**
            !build-win/**/*.o
            !build-win/**/*.ninja
            !build-win/.ninja_log
            !build-win/.ninja_deps
            !build-win/CMakeCache.txt
            !build-win/cmake_install.cmake
          if-no-files-found: error

  package-and-release:
    name: Generar Instalador Inno Setup y Publicar Release
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar artefactos compilados de Windows
        uses: actions/download-artifact@v4
        with:
          name: build-win
          path: build-win

      - name: Instalar Inno Setup
        run: choco install innosetup -y

      - name: Calcular Versión, Metadatos y Listado de Commits
        id: meta
        shell: bash
        run: |
          # 1. Obtener versión declarada en CMakeLists.txt
          VERSION=$(grep -oP 'project\(\s*ProyecThor\s+VERSION\s+\K[0-9.]+' CMakeLists.txt || echo "1.0.2")
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          # 2. Configurar etiqueta y tipo de release según rama o tag
          REF_NAME="${{ github.ref_name }}"
          IS_TAG="${{ github.ref_type == 'tag' }}"

          if [ "$IS_TAG" = "true" ]; then
              TAG_NAME="$REF_NAME"
              if [[ "$REF_NAME" == *"beta"* || "$REF_NAME" == *"rc"* ]]; then
                  IS_PRERELEASE="true"
                  RELEASE_NAME="ProyecThor ${REF_NAME} (Pre-release)"
              else
                  IS_PRERELEASE="false"
                  RELEASE_NAME="ProyecThor ${REF_NAME}"
              fi
          elif [ "$REF_NAME" = "beta" ]; then
              TAG_NAME="v${VERSION}-beta"
              IS_PRERELEASE="true"
              RELEASE_NAME="ProyecThor v${VERSION} (Pre-release Beta)"
          else
              TAG_NAME="v${VERSION}"
              IS_PRERELEASE="false"
              RELEASE_NAME="ProyecThor v${VERSION}"
          fi

          echo "TAG_NAME=$TAG_NAME" >> $GITHUB_ENV
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

          # 3. Generar listado de commits
          echo "## Lista de cambios y commits incluidos:" > release_notes.md
          echo "" >> release_notes.md

          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
              echo "### Commits desde la versión previa ($PREV_TAG):" >> release_notes.md
              git log "${PREV_TAG}..HEAD" --pretty=format:"* %s (%h - %an)" >> release_notes.md
          else
              echo "### Últimos commits de esta versión:" >> release_notes.md
              git log -n 25 --pretty=format:"* %s (%h - %an)" >> release_notes.md
          fi
          echo "" >> release_notes.md

      - name: Compilar Instalador Inno Setup (.exe)
        shell: bash
        run: |
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DBuildDir=$(pwd)/build-win" \
            "/DProductVersion=${{ env.VERSION }}" \
            "packaging/windows/ProyecThor.iss"

          # Copia versionada para descarga directa
          cp packaging/windows/dist/ProyecThor_Setup.exe packaging/windows/dist/ProyecThor_Setup_v${{ env.VERSION }}.exe

      - name: Publicar Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release_notes.md
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}
          generate_release_notes: true
          files: |
            packaging/windows/dist/ProyecThor_Setup.exe
            packaging/windows/dist/ProyecThor_Setup_v${{ env.VERSION }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
