name: Build

# Solo build-linux: el build de Windows lo compila el autor a mano en su
# propia PC (no usa el instalador .msi), asi que no tiene sentido gastar
# minutos de CI en eso -- ver commit que retiro build-windows/package-msi.
on:
  push:
    branches: [main, beta]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        # libglfw3-dev NO se instala a proposito: GLFW se compila desde
        # fuente en CMakeLists.txt (FetchContent, tag 3.4) porque Ubuntu
        # todavia empaqueta la 3.3.x, que le falta glfwGetPlatform() (usada
        # por el backend de ImGui, ver comentario en CMakeLists.txt) -- en
        # cambio se instalan los paquetes de desarrollo que GLFW necesita
        # para compilar sus backends X11 y Wayland el mismo.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build libgl1-mesa-dev libx11-dev \
            libxcomposite-dev libopencv-dev libpipewire-0.3-dev libdbus-1-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev wayland-protocols extra-cmake-modules

      - name: Configurar
        run: cmake -B build-linux -G Ninja -DPROYECTHOR_BUILD_NUMBER=${{ github.run_number }}

      - name: Compilar
        run: cmake --build build-linux

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProyecThor-linux-${{ github.run_number }}
          path: |
            build-linux/**
            !build-linux/CMakeFiles/**
            !build-linux/_deps/**
            !build-linux/generated/**
            !build-linux/**/*.o
            !build-linux/**/*.ninja
            !build-linux/.ninja_log
            !build-linux/.ninja_deps
            !build-linux/CMakeCache.txt
            !build-linux/cmake_install.cmake
          if-no-files-found: error

  # Valida que packaging/arch/PKGBUILD compila y empaqueta de verdad -- sin
  # esto, un PKGBUILD roto solo se descubriria cuando alguien intentara
  # instalarlo en su propia maquina (CachyOS/Arch). makepkg se niega a
  # correr como root, asi que hace falta crear un usuario de build aparte.
  package-arch:
    needs: build-linux
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Preparar usuario de build
        run: |
          pacman -Syu --noconfirm --needed sudo git
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder

      - uses: actions/checkout@v4

      - name: Compilar PKGBUILD (makepkg -s instala las dependencias declaradas solo)
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE/packaging/arch' && makepkg -s --noconfirm"

      - name: Subir paquete
        uses: actions/upload-artifact@v4
        with:
          name: proyecthor-arch-${{ github.run_number }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
