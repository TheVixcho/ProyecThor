app-id: io.github.thevixcho.ProyecThor
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: proyecthor

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.portal.OpenURI

modules:
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: git
        url: https://github.com/nlohmann/json.git
        tag: v3.11.3
        commit: 9cca280a4d0ccf0c08f47a99aa71d1b0e52f8d03

  - name: glm
    buildsystem: cmake-ninja
    config-opts:
      - -DGLM_TEST_ENABLE=OFF
      - -DBUILD_SHARED_LIBS=OFF
    sources:
      - type: git
        url: https://github.com/g-truc/glm.git
        tag: 0.9.9.8
        commit: bf71a834948186f4097caa076cd2663c69a10e1e

  - name: glfw
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DGLFW_BUILD_EXAMPLES=OFF
      - -DGLFW_BUILD_TESTS=OFF
      - -DGLFW_BUILD_DOCS=OFF
      - -DGLFW_BUILD_X11=ON
      - -DGLFW_BUILD_WAYLAND=ON
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        tag: '3.4'
        commit: a74efa0d5628b74adc0426af4c5710e287fa7c2c

  - name: proyecthor
    buildsystem: cmake-ninja
    sources:
      - type: git
        url: https://github.com/TheVixcho/ProyecThor.git
        tag: v1.0.1
        commit: e5c1369bf57a8a25c1356f671c6caecb062ca6c8